server {
    listen 80;
    server_name iagro360.xyz www.iagro360.xyz localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;
    gzip_min_length 256;

    # Cache para archivos estáticos
    location ~* \.(css|js|jpe?g|png|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # RADAR DINÁMICO
    # /radar/100
    # /radar/101
    # /radar/EP999
    # ==========================================
    location ~ ^/radar/([^/]+)$ {
        try_files /radar.html =404;
    }

    # Rutas limpias normales
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}