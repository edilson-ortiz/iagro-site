<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iAgro - Pronóstico de Lluvia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#182849;
    --navy-dark:#101c37;
    --green:#7cb342;
    --green-dark:#5c8a2e;
    --sky:#8ecae6;
    --blue:#2e86c1;
    --paper:#f5f8fa;
    --text-light:#f5f8fa;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--navy-dark);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text-light);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ---- Map (ocupa todo el espacio disponible, arrancando desde arriba del todo) ---- */
  .map-wrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#0e161f;
    overflow:hidden; /* clave: recorta lo que sobresalga */
  }
  #mapaFrame{
    position:absolute;
    top:-10px;
    left:0;
    width:100%;
    height:calc(100% + 10px);
    border:0;
  }
  .map-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-light);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    opacity:0.7;
    pointer-events:none;
  }

  /* ---- Overlay: header + season-bar + legend + ayuda flotan encima del mapa (solo arriba) ---- */
  .overlay{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;
    pointer-events:none; /* deja pasar el gesto al mapa por defecto */
  }
  .overlay > *{
    pointer-events:auto; /* pero los controles del overlay sí reciben toques */
  }

  header{
    background:var(--navy-dark);
    padding:12px 16px 10px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header img.logo{
    width:42px;
    height:42px;
    flex-shrink:0;
  }
  .header-text{min-width:0;}
  .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--sky);
    opacity:0.9;
    margin-bottom:2px;
  }
  h1.lote-nombre{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:1.35rem;
    line-height:1.15;
    color:var(--text-light);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lote-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:var(--sky);
    margin-top:3px;
    opacity:0.8;
  }

  /* ---- Signature season bar (colores del logo) ---- */
  .season-bar{
    height:6px;
    background:linear-gradient(90deg,var(--navy) 0%,var(--green) 35%,var(--sky) 65%,var(--blue) 100%);
    background-size:200% 100%;
    animation:driftSeason 18s linear infinite;
  }
  @keyframes driftSeason{
    0%{background-position:0% 0%;}
    100%{background-position:200% 0%;}
  }
  @media (prefers-reduced-motion: reduce){
    .season-bar{animation:none;}
  }

  /* ---- Legend ---- */
  .legend{
    display:flex;
    gap:14px;
    padding:9px 16px;
    background:var(--navy);
    font-size:0.76rem;
    font-weight:600;
    flex-wrap:wrap;
  }
  .chip{display:flex;align-items:center;gap:6px;color:var(--text-light);opacity:0.9;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-suave{background:var(--sky);}
  .dot-moderada{background:var(--blue);}
  .dot-intensa{background:var(--green-dark);}

  /* ---- Ayuda ---- */
  details.ayuda{
    background:var(--navy);
    border-top:1px solid rgba(245,248,250,0.08);
  }
  details.ayuda summary{
    list-style:none;
    cursor:pointer;
    padding:9px 16px;
    font-size:0.8rem;
    font-weight:600;
    color:var(--green);
    display:flex;
    align-items:center;
    gap:6px;
  }
  details.ayuda summary::-webkit-details-marker{display:none;}
  details.ayuda summary::after{
    content:'+';
    margin-left:auto;
    font-size:1rem;
  }
  details.ayuda[open] summary::after{content:'−';}
  details.ayuda p{
    padding:0 16px 13px;
    font-size:0.83rem;
    line-height:1.5;
    color:var(--text-light);
    opacity:0.85;
  }

  /* ---- Footer ---- */
  footer{
    flex-shrink:0;
    background:var(--navy-dark);
    text-align:center;
    padding:6px 10px;
    font-size:0.66rem;
    color:var(--text-light);
    opacity:0.5;
  }
</style>
</head>
<body>
<div id="app">

  <div class="map-wrap">
    <div class="map-loading" id="mapLoading">Cargando pronóstico…</div>
    <iframe id="mapaFrame" sandbox="allow-scripts allow-same-origin" allowfullscreen title="Mapa de precipitación"></iframe>
  </div>

  <div class="overlay">
    <header>
      <img class="logo" src="/img/logo.png" alt="iAgro">
      <div class="header-text">
        <div class="brand">iAgro · Temporada de Siembra</div>
        <h1 class="lote-nombre" id="loteNombre">Cargando lote…</h1>
        <p class="lote-meta" id="loteMeta">—</p>
      </div>
    </header>

    <div class="season-bar" aria-hidden="true"></div>

    <div class="legend">
      <span class="chip"><span class="dot dot-suave"></span>Suave</span>
      <span class="chip"><span class="dot dot-moderada"></span>Moderada</span>
      <span class="chip"><span class="dot dot-intensa"></span>Intensa</span>
    </div>
  </div>

  <footer>
  iAgro · Pronóstico de precipitación en tiempo real ·
  Datos de lluvia por <a href="https://www.ventusky.com" target="_blank" rel="noopener noreferrer" style="color:var(--sky);">Ventusky.com</a>
</footer>

</div>

<script>

const API_BASE =
  'https://n8n.iagro360.xyz/webhook/2188cc9b-b229-4e2d-946b-4769f9b169ec/client';

const loteNombre =
  document.getElementById('loteNombre');

const loteMeta =
  document.getElementById('loteMeta');

const mapLoading =
  document.getElementById('mapLoading');

const frame =
  document.getElementById('mapaFrame');


async function cargarRadar() {

  // ==========================================
  // OBTENER CÓDIGO DE /radar/11
  // ==========================================

  const path = window.location.pathname;

  const match = path.match(
    /^\/radar\/([^\/]+)\/?$/
  );

  if (!match) {

    loteNombre.textContent =
      'Radar no especificado';

    loteMeta.textContent =
      'URL inválida';

    mapLoading.textContent =
      'Radar no disponible';

    return;
  }

  const codigo = match[1];

  console.log(
    'Código detectado:',
    codigo
  );


  // ==========================================
  // CARGANDO
  // ==========================================

  loteNombre.textContent =
    'Cargando…';

  loteMeta.textContent =
    `Código: ${codigo}`;

  mapLoading.textContent =
    'Consultando radar…';


  try {

    // ========================================
    // CONSULTAR API
    // ========================================

    const apiUrl =
      `${API_BASE}/${encodeURIComponent(codigo)}`;

    console.log(
      'Consultando API:',
      apiUrl
    );


    const response =
      await fetch(apiUrl);


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const resultado =
      await response.json();


    console.log(
      'Respuesta API:',
      resultado
    );


    // ========================================
    // RADAR NO EXISTE
    // ========================================

    if (
      resultado.success !== true ||
      !resultado.data
    ) {

      loteNombre.textContent =
        'Radar no encontrado';

      loteMeta.textContent =
        `Código: ${codigo}`;

      mapLoading.textContent =
        'No existe este radar';

      return;
    }


    // ========================================
    // DATOS DE LA API
    // ========================================

    const data =
      resultado.data;


    // IMPORTANTE:
    // Tu API entrega "lat" y "lon"

    const lat =
      Number(data.lat);

    const lon =
      Number(data.lon);


    const nombre =
      data.nombre_propiedad ||
      data.codigo ||
      `Radar ${codigo}`;


    console.log(
      'Latitud:',
      lat
    );

    console.log(
      'Longitud:',
      lon
    );

    console.log(
      'Nombre:',
      nombre
    );


    // ========================================
    // VALIDAR COORDENADAS
    // ========================================

    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ) {

      loteNombre.textContent =
        'Radar sin ubicación';

      loteMeta.textContent =
        'Las coordenadas no son válidas';

      mapLoading.textContent =
        'Mapa no disponible';

      return;
    }


    // ========================================
    // MOSTRAR INFORMACIÓN
    // ========================================

    loteNombre.textContent =
      nombre;

    loteMeta.textContent =
      `Lat ${lat}, Lon ${lon}`;


    // ========================================
    // CREAR URL VENTUSKY
    // ========================================

    const zoom = 5;


    const src =
      `https://embed.ventusky.com/?p=${lat};${lon};${zoom}` +
      `&l=rain-3h&w=soft` +
      `&pin=${lat};${lon};dot;${encodeURIComponent(nombre)}`;


    console.log(
      'URL Ventusky:',
      src
    );


    // ========================================
    // CARGAR RADAR
    // ========================================

    frame.src = src;


    frame.addEventListener(
      'load',
      () => {

        console.log(
          'Ventusky cargado'
        );

        mapLoading.style.display =
          'none';

      },
      { once: true }
    );


  } catch (error) {

    console.error(
      'Error consultando API:',
      error
    );


    loteNombre.textContent =
      'Error de conexión';

    loteMeta.textContent =
      `Código: ${codigo}`;

    mapLoading.textContent =
      'No se pudo consultar el radar';

  }

}


// ==========================================
// INICIAR
// ==========================================

cargarRadar();

</script>

</body>
</html>
