<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iAgro · Regístrate al pronóstico del clima</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,500&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --navy: #1B3A5C;
      /* azul marino del anillo y del ícono */
      --azure: #2D9CDB;
      /* azul del segmento del logo */
      --sky: #7FCBEA;
      /* celeste del anillo interior */
      --leaf: #7CB342;
      /* verde de la hoja */
      --cloud: #F5F8FA;
      --slate: #24303D;
      --slate-soft: #64707C;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      font-family: 'Work Sans', sans-serif;
      color: var(--slate);
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--cloud);
    }

    header {
      padding: 14px 20px;
      background: var(--navy);
      color: #fff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #brand-mark {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
    }

    header .title-block h1 {
      font-family: 'Newsreader', serif;
      font-weight: 600;
      font-size: 1.28rem;
      margin: 0;
    }

    header .title-block p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: #B9CBDB;
    }

    #map-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      width: 34px;
      height: 44px;
      pointer-events: none;
      z-index: 500;
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s ease;
    }

    #pin.dropped {
      transform: translate(-50%, -100%) translateY(4px);
    }

    #search-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 600;
      display: flex;
      gap: 8px;
    }

    #search-input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      font-family: 'Work Sans', sans-serif;
      font-size: 0.92rem;
      box-shadow: 0 2px 10px rgba(27, 58, 92, 0.3);
    }

    #locate-btn {
      position: absolute;
      right: 14px;
      z-index: 650;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(27, 58, 92, 0.35);
      cursor: pointer;
      transition: bottom 0.15s ease;
    }

    #locate-btn:active {
      background: #EEF3F6;
    }

    #loc-toast {
      position: absolute;
      top: 70px;
      left: 14px;
      right: 14px;
      z-index: 650;
      background: var(--navy);
      color: #fff;
      font-size: 0.82rem;
      line-height: 1.35;
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(27, 58, 92, 0.35);
      display: none;
    }

    #results {
      position: absolute;
      top: 60px;
      left: 14px;
      right: 14px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(27, 58, 92, 0.35);
      z-index: 600;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }

    #results div {
      padding: 10px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      border-bottom: 1px solid #EEE;
    }

    #results div:last-child {
      border-bottom: none;
    }

    #results div:hover {
      background: #F5F8FA;
    }

    #confirm-panel {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 14px;
      right: 14px;
      z-index: 600;
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(27, 58, 92, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #coord-label {
      font-size: 0.78rem;
      color: var(--slate-soft);
      line-height: 1.3;
    }

    #coord-label b {
      display: block;
      color: var(--slate);
      font-size: 0.86rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--leaf);
      color: #fff;
    }

    .btn-primary:disabled {
      background: #BBD8A0;
      cursor: not-allowed;
    }

    #form-panel {
      position: absolute;
      inset: 0;
      background: var(--cloud);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(.4, 0, .2, 1);
      z-index: 700;
      display: flex;
      flex-direction: column;
      padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
    }

    #form-panel.open {
      transform: translateY(0);
    }

    #form-panel h2 {
      font-family: 'Newsreader', serif;
      font-weight: 600;
      font-size: 1.2rem;
      margin: 4px 0 6px;
      color: var(--navy);
    }

    #form-panel p.hint {
      margin: 0 0 20px;
      font-size: 0.88rem;
      color: var(--slate-soft);
    }

    #back-link {
      background: none;
      border: none;
      color: var(--azure);
      font-size: 0.85rem;
      padding: 0;
      margin-bottom: 14px;
      cursor: pointer;
      text-align: left;
      width: fit-content;
    }

    label {
      font-size: 0.82rem;
      color: var(--slate-soft);
      display: block;
      margin-bottom: 6px;
    }

    #name-input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid #D2DCE3;
      font-family: 'Work Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 18px;
    }

    #name-input:focus {
      outline: none;
      border-color: var(--azure);
    }

    #submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 0.98rem;
    }

    #status-msg {
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    #status-msg.error {
      color: #C0392B;
    }

    #status-msg.loading {
      color: var(--slate-soft);
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
    }
  </style>
</head>

<body>

  <header>
    <img id="brand-mark" src="img/logo.png" alt="iAgro">
    <div class="title-block">
      <h1>IAgro</h1>
      <p>Asistente de pronóstico del clima</p>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <svg id="pin" viewBox="0 0 34 44">
      <path d="M17 0C7.6 0 0 7.6 0 17c0 12 17 27 17 27s17-15 17-27C34 7.6 26.4 0 17 0z" fill="#1B3A5C" />
      <circle cx="17" cy="17" r="7" fill="#F5F8FA" />
    </svg>

    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Buscar dirección o zona…" autocomplete="off">
    </div>
    <div id="results"></div>
    <div id="loc-toast"></div>

    <button id="locate-btn" title="Usar mi ubicación">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <circle cx="12" cy="12" r="7" fill="none" stroke="#2D9CDB" stroke-width="2" />
        <circle cx="12" cy="12" r="2.2" fill="#2D9CDB" />
        <line x1="12" y1="1" x2="12" y2="4.5" stroke="#2D9CDB" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="19.5" x2="12" y2="23" stroke="#2D9CDB" stroke-width="2" stroke-linecap="round" />
        <line x1="1" y1="12" x2="4.5" y2="12" stroke="#2D9CDB" stroke-width="2" stroke-linecap="round" />
        <line x1="19.5" y1="12" x2="23" y2="12" stroke="#2D9CDB" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <div id="confirm-panel">
      <div id="coord-label">Ubicación seleccionada<b id="coord-text">Mueve el mapa…</b></div>
      <button class="btn btn-primary" id="confirm-btn">Continuar</button>
    </div>

    <div id="form-panel">
      <button id="back-link">← Cambiar ubicación</button>
      <h2>Ya casi terminas</h2>
      <p class="hint">Con el nombre de tu propiedad generamos un código para vincular tu WhatsApp al asistente de
        pronóstico de iAgro.</p>
      <label for="name-input">Nombre de la propiedad</label>
      <input id="name-input" type="text" placeholder="Ej. Finca La Esperanza">
      <button class="btn btn-primary" id="submit-btn">Continuar a WhatsApp</button>
      <div id="status-msg"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // ====== CONFIGURA ESTOS DOS VALORES (el mapa NO necesita token) ======
    const N8N_WEBHOOK_URL = "https://n8n.iagro360.xyz/webhook/registro-clima"; // URL del Webhook node de n8n
    const WHATSAPP_NUMBER = "59162314661"; // número del asistente, con código de país, sin +
    // ======================================================================

    const DEFAULT_CENTER = [-17.7833, -63.1821]; // Santa Cruz de la Sierra, ajustar si aplica

    const map = L.map('map', { zoomControl: false }).setView(DEFAULT_CENTER, 17);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Esri World Imagery: satélite gratis, sin token ni API key
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
      maxZoom: 19
    }).addTo(map);

    const pin = document.getElementById('pin');
    const coordText = document.getElementById('coord-text');
    let selected = { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1] };

    function updateCoordLabel() {
      coordText.textContent = `${selected.lat.toFixed(5)}, ${selected.lng.toFixed(5)}`;
    }
    updateCoordLabel();

    map.on('movestart', () => pin.classList.remove('dropped'));
    map.on('moveend', () => {
      const c = map.getCenter();
      selected = { lat: c.lat, lng: c.lng };
      updateCoordLabel();
      pin.classList.add('dropped');
    });

    // Buscar dirección con Nominatim (OpenStreetMap) - también gratis, sin token
    const searchInput = document.getElementById('search-input');
    const resultsBox = document.getElementById('results');
    let searchTimer = null;

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = searchInput.value.trim();
      if (q.length < 3) { resultsBox.style.display = 'none'; return; }
      searchTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`);
          const data = await res.json();
          if (!data.length) { resultsBox.style.display = 'none'; return; }
          resultsBox.innerHTML = data.map((d, i) =>
            `<div data-i="${i}">${d.display_name}</div>`
          ).join('');
          resultsBox.style.display = 'block';
          resultsBox.querySelectorAll('div').forEach(el => {
            el.addEventListener('click', () => {
              const d = data[el.dataset.i];
              map.setView([parseFloat(d.lat), parseFloat(d.lon)], 18);
              resultsBox.style.display = 'none';
              searchInput.value = d.display_name;
            });
          });
        } catch (e) { /* red no disponible, se ignora */ }
      }, 450);
    });

    // Ubicación actual
    const locToast = document.getElementById('loc-toast');
    let toastTimer = null;

    function mostrarAvisoUbicacion(msg) {
      clearTimeout(toastTimer);
      locToast.textContent = msg;
      locToast.style.display = 'block';
      toastTimer = setTimeout(() => { locToast.style.display = 'none'; }, 5000);
    }

    function irAMiUbicacion(zoom, silencioso) {
      if (!navigator.geolocation) {
        if (!silencioso) mostrarAvisoUbicacion('Tu navegador no soporta geolocalización.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], zoom);
        },
        err => {
          if (silencioso) return; // el intento automático al cargar falla en silencio
          let msg = 'No se pudo obtener tu ubicación.';
          if (err.code === 1) msg = 'Activa el permiso de ubicación para este sitio: toca el candado o el ícono junto a la URL y permite "Ubicación".';
          else if (err.code === 2) msg = 'No se pudo determinar tu ubicación. Revisa que el GPS del celular esté activado.';
          else if (err.code === 3) msg = 'Tardó demasiado en responder. Intenta de nuevo.';
          mostrarAvisoUbicacion(msg);
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    document.getElementById('locate-btn').addEventListener('click', () => irAMiUbicacion(18, false));

    // Al cargar la página, intenta centrar directo en la ubicación del dispositivo (en silencio, sin avisos).
    irAMiUbicacion(17, true);

    // Posiciona el botón de centrar justo arriba del panel de "Continuar", como en Google Maps.
    const locateBtn = document.getElementById('locate-btn');
    const confirmPanel = document.getElementById('confirm-panel');
    function posicionarBotonCentrar() {
      const alto = confirmPanel.offsetHeight;
      locateBtn.style.bottom = `calc(${alto}px + 30px + env(safe-area-inset-bottom, 0px))`;
    }
    posicionarBotonCentrar();
    window.addEventListener('resize', posicionarBotonCentrar);
    if (window.ResizeObserver) {
      new ResizeObserver(posicionarBotonCentrar).observe(confirmPanel);
    }

    // En Chrome móvil la barra de direcciones aparece/desaparece y cambia el alto visible;
    // esto reajusta el mapa para que el pin central siga alineado con el punto real.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => map.invalidateSize(), 120);
    });

    // Paso 1 -> Paso 2
    const formPanel = document.getElementById('form-panel');
    document.getElementById('confirm-btn').addEventListener('click', () => {
      formPanel.classList.add('open');
    });
    document.getElementById('back-link').addEventListener('click', () => {
      formPanel.classList.remove('open');
    });

    // Envío final
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    const nameInput = document.getElementById('name-input');

    submitBtn.addEventListener('click', async () => {
      const nombre = nameInput.value.trim();
      if (!nombre) {
        statusMsg.textContent = 'Escribe el nombre de la propiedad para continuar.';
        statusMsg.className = 'error';
        return;
      }
      submitBtn.disabled = true;
      statusMsg.textContent = 'Generando tu código…';
      statusMsg.className = 'loading';

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre,
            lat: selected.lat,
            lng: selected.lng
          })
        });
        if (!res.ok) throw new Error('Respuesta no válida del servidor');
        const data = await res.json();
        if (!data.codigo) throw new Error('No se recibió un código');

        const texto = `[IAGRO]:[${data.codigo}]
Envía este mensaje sin modificarlo para completar tu registro.`;

        const waLink =
          `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(texto)}`;

        window.location.href = waLink;
      } catch (err) {
        statusMsg.textContent = 'No se pudo completar el registro. Intenta de nuevo.';
        statusMsg.className = 'error';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>

</html>
